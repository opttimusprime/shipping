apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: shipping
  labels:
    app: shipping
    project: roboshop

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shipping

  template:
    metadata:
      labels:
        app: shipping
        project: roboshop

    spec:
      serviceAccountName: shipping-sa

      containers:
        - name: shipping
          image: "717090908085.dkr.ecr.us-east-1.amazonaws.com/roboshop/shipping@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Application environment variables
          env:
            - name: DB_HOST
              value: "mysql.mysql.svc.cluster.local"

            - name: CART_ENDPOINT
              value: "cart.cart.svc.cluster.local:8080"

          # Resource requests and limits
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"

          # Startup probe
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          # Liveness probe
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
